# Post-install section
%post --log=/root/ks-post.log --interpreter=/bin/bash

# Enabling IOMMU for virtualization passthrough
echo "=== Enabling IOMMU for virtualization passthrough ==="
grubby --update-kernel=ALL --args="intel_iommu=on iommu=pt"
dracut -f

# /etc/hosts configuration
echo "172.28.150.150 kvm-node40.lab.local kvm-node40" >> /etc/hosts
echo "172.28.150.151 kvm-node41.lab.local kvm-node41" >> /etc/hosts
echo "172.28.153.150 kvm-node40-mig.lab.local kvm3-node40-mig" >> /etc/hosts
echo "172.28.153.151 kvm-node41-mig.lab.local kvm3-node41-mig" >> /etc/hosts

# Disable SELinux
sed -i 's/^SELINUX=enforcing/SELINUX=disabled/' /etc/selinux/config

# For additional safety, set passwords to expire immediately after first boot:
# chage -d 0 root
chage -d 0 sysadmin

# Turing on rc-local.service
chmod 755 /etc/rc.d/rc.local
systemctl enable rc-local.service


# Create runonce service
mkdir /root/bin
mkdir /mnt/cdrom/
mount -o loop /dev/sr0 /mnt/cdrom/
cp -rvf /mnt/cdrom/mydata/KVM_Install_Scripts /root/bin/ 
mv /root/bin/KVM_Install_Scripts/02_kvm_postconfig/02_kvm_postconfig_local.sh /root/bin/
chmod +x /root/bin/02_kvm_postconfig_local.sh
mv /root/bin/KVM_Install_Scripts/RPM /root/bin/
sudo find /root/bin/ -type f \( -name "*.sh" -o -name "*.cfg" \) -exec dos2unix {} \;

cat > /etc/systemd/system/runonce.service << EOF
[Unit]
Description=Run once
After=network-online.target

[Service]
Type=simple
ExecStart=/root/bin/02_kvm_postconfig_local.sh

[Install]
WantedBy=multi-user.target
EOF

# Enable runonce service
chmod +x /root/bin/02_kvm_postconfig_local.sh
systemctl daemon-reload
systemctl enable runonce.service


%end

# Reboot after install
reboot --eject