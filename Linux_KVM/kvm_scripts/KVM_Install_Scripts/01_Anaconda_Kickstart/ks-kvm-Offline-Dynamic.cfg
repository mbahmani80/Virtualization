##################  Disk policy: Dynamic disk detection ####################
##########################

%pre --interpreter=/usr/bin/bash --log=/root/anaconda-ks-pre.log
echo "===== Starting dynamic disk selection ====="
MIN_SIZE=102400
for disk in /dev/sd[a-z]; do
    if [[ "$(cat /sys/block/$(basename $disk)/removable)" == "1" ]]; then
        continue
    fi
    size=$(lsblk -b -dn -o SIZE "$disk")
    size_mib=$((size / 1024 / 1024))
    echo "Checking $disk: $size_mib MiB"
    if [[ $size_mib -ge $MIN_SIZE ]]; then
        INSTALL_DISK="$disk"
        echo "Selected disk: $INSTALL_DISK"
        break
    fi
done
if [[ -z "$INSTALL_DISK" ]]; then
    echo "No suitable disk found. Aborting installation."
    exit 1
fi
echo "$INSTALL_DISK" > /tmp/install_disk
wipefs -f -a ${INSTALL_DISK}
dd if=/dev/zero of=${INSTALL_DISK} bs=1M count=400 conv=fdatasync
%end

%include /tmp/install_disk

ignoredisk --only-use=$(cat /tmp/install_disk)
clearpart --drives=$(cat /tmp/install_disk) --initlabel --disklabel=gpt

bootloader --boot-drive=$(cat /tmp/install_disk) --append="crashkernel=auto"
part biosboot --fstype="biosboot" --size=2 --ondisk=$(cat /tmp/install_disk)
part /boot --fstype="ext4" --ondisk=$(cat /tmp/install_disk) --size=2048 --label=boot
part /boot/efi --fstype="efi" --ondisk=$(cat /tmp/install_disk) --size=1024 --label=EFI
part pv.01 --fstype="lvmpv" --ondisk=$(cat /tmp/install_disk) --size=1024 --grow

volgroup rl_vgos pv.01
logvol /var/lib/libvirt --fstype="xfs" --size=1024 --grow --vgname=rl_vgos --name=kvm_pool1
logvol /     --fstype="ext4" --size=51200 --vgname=rl_vgos  --name=root
logvol /tmp  --fstype="ext4" --size=6144  --vgname=rl_vgos --name=tmp
logvol /var  --fstype="ext4" --size=10240 --vgname=rl_vgos --name=var
logvol swap  --fstype="swap" --size=16384 --vgname=rl_vgos --name=swap


