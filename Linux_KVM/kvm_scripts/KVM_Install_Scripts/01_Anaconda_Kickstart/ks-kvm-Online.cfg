# Post-install section
%post --log=/root/ks-post.log --interpreter=/bin/bash
echo "=== Enabling EPEL and CRB repositories ==="
dnf install -y epel-release
/usr/bin/crb enable

echo "=== Enabling Open vSwitch NFV SIG repository ==="
dnf install -y centos-release-nfv-openvswitch

echo "=== Updating cache ==="
dnf makecache

echo ">>> Updating system packages..."
dnf update -y

echo "=== Installing base utilities and virtualization packages ==="
dnf install -y \
    fail2ban openssl sshguard tcpdump net-tools lldpd bind-utils lvm2 xfsprogs nfs-utils rsync parted \
    lsscsi vim nano screen curl wget zip unzip lshw pv htop iotop iftop sysstat dstat glances gpm \
    qemu-kvm libvirt virt-install libguestfs-tools virt-top virt-viewer \
    edk2-ovmf swtpm swtpm-tools openvswitch3.5.x86_64 NetworkManager-ovs

echo "=== Enabling libvirt and Open vSwitch services, ... ==="
systemctl enable --now libvirtd
systemctl enable --now openvswitch
systemctl enable --now lldpd

echo "=== Installing Cockpit and extensions ==="
dnf install -y cockpit cockpit-*

echo "=== Enabling Cockpit service ==="
systemctl enable --now cockpit.socket
firewall-cmd --permanent --zone=public --add-service=cockpit
firewall-cmd --reload

# Enable IP forwarding and reverse path filtering
echo "=== Kernel network sysctl tuning ==="
echo "net.ipv4.ip_forward=1" >> /etc/sysctl.conf
echo "net.ipv4.conf.all.rp_filter=2" >> /etc/sysctl.conf


# Enabling IOMMU for virtualization passthrough
echo "=== Enabling IOMMU for virtualization passthrough ==="
grubby --update-kernel=ALL --args="intel_iommu=on iommu=pt"
dracut -f

# Adding user sysadmin to kvm and libvirt groups
echo "=== Adding user sysadmin to kvm and libvirt groups ==="
usermod -aG kvm,libvirt sysadmin

# Allow all bridges for KVM
echo "allow all" > /etc/qemu-kvm/bridge.conf
systemctl restart libvirtd
systemctl restart NetworkManager

# /etc/hosts configuration
echo "172.28.150.150 kvm-node40.lab.local kvm-node40" >> /etc/hosts
echo "172.28.150.151 kvm-node41.lab.local kvm-node41" >> /etc/hosts
echo "172.28.153.150 kvm-node40-mig.lab.local kvm3-node40-mig" >> /etc/hosts
echo "172.28.153.151 kvm-node41-mig.lab.local kvm3-node41-mig" >> /etc/hosts

# Disable SELinux
sed -i 's/^SELINUX=enforcing/SELINUX=disabled/' /etc/selinux/config

# For additional safety, set passwords to expire immediately after first boot:
# chage -d 0 root
chage -d 0 sysadmin

# Turing on rc-local.service
chmod 755 /etc/rc.d/rc.local
systemctl enable rc-local.service

# Enable gpm service
systemctl enable --now gpm


