# ==============================================================================================
# Kickstart: ks-kvm-Online.cfg
# Description: Anaconda Kickstart: Automated Wipe of All Disks and Installation of Rocky Linux / RHEL 9.x 
# Author: Mahdi Bahmani
# Date: 2025-08-28
# Usage: 
# =========================== 1. Boot with Kickstart over HTTP/HTTPS:===========================
#
# Boot your target machine from the Rocky Linux / RHEL ISO.
# At the GRUB menu:
#    Highlight Install Rocky Linux / RHEL.
#    Press e (UEFI/GRUB) or Tab (BIOS) to edit the kernel line.
#
# DHCP example:
# inst.ks=http://192.168.56.100/ks-kvm-Online.cfg ip=dhcp
#
# or
# inst.ks=http://192.168.56.100/ks-kvm-Online.cfg ip=dhcp ip=dhcp
#
# Static multi-NIC example:
# inst.ks=http://192.168.56.100/ks-kvm-Online.cfg ip=172.28.150.130::172.28.150.1:255.255.255.0:kvm-node40.lab.local:ens33:none \
# ip=172.28.178.130::172.28.178.1:255.255.255.0:kvm-node01-data:ens224:none \
# ip=dhcp:ens256 nameserver=8.8.8.8
#
# Press Ctrl + x to boot.
# =========================== 2. Boot with Kickstart from USB: =================================
#
#    At the boot menu, hit e (UEFI) or Tab (BIOS). On the kernel line (linux or linuxefi), append:
#    
#    inst.ks=hd:LABEL=USBLABEL:/ks-kvm-Online.cfg
#
#    Replace USBLABEL with your USB’s label (check with blkid). Press Ctrl + x to boot.
#
# =========================== 3. Embed Kickstart into ISO: =====================================
#
#    At the boot menu, hit e (UEFI) or Tab (BIOS). On the kernel line (linux or linuxefi), append:
#    
#    inst.ks=cdrom:/ks-kvm-Online.cfg
#
#    Replace USBLABEL with your USB’s label (check with blkid). Press Ctrl + x to boot.
#
# ==============================================================================================

