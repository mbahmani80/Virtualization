##################  Disk policy: Wipe only sda ####################
##########################
# %pre script: Wipe only sda safely
##########################
%pre --interpreter=/usr/bin/bash --log=/root/anaconda-ks-pre.log

echo "===== Starting pre-install wipe of /dev/sda ====="

# Wait for udev to settle
udevadm settle

# Deactivate only VGs on /dev/sda
for pv in $(pvs --noheadings -o pv_name); do
    if [[ "$pv" == /dev/sda* ]]; then
        vg=$(pvs --noheadings -o vg_name $pv | awk '{print $1}')
        vgchange -an $vg 2>/dev/null || true
    fi
done


# Stop any software RAID arrays
echo "Checking for RAID arrays..."
raid_devices=$(grep ^md /proc/mdstat | cut -d : -f 1)
if [ -n "$raid_devices" ]; then
    for raid in $raid_devices; do
        echo "Stopping RAID device /dev/$raid"
        mdadm --stop -f /dev/$raid 2>/dev/null || true
        echo "Wiping signatures on /dev/$raid"
        wipefs -f -a /dev/$raid 2>/dev/null || true
    done
else
    echo "No RAID devices found"
fi

# Wipe /dev/sda
if [ -b /dev/sda ]; then
    echo "Found /dev/sda, processing..."

    # Count partitions and filesystem signatures
    part_count=$(parted -s /dev/sda print 2>/dev/null | awk '/^[ 0-9]+/{count++} END{print count+0}')
    fs_count=$(wipefs -n /dev/sda | wc -l)

    if [ "$part_count" -gt 0 ] || [ "$fs_count" -gt 0 ]; then
        echo "Removing filesystem signatures..."
        wipefs -f -a /dev/sda* 2>/dev/null || true

        # Delete partitions one by one
        echo "Deleting partitions..."
        for part in $(parted -s /dev/sda print | awk '/^[ 0-9]+/{print $1}'); do
            echo "Deleting partition $part"
            parted -s /dev/sda rm $part 2>/dev/null || true
        done
    else
        echo "/dev/sda has no partitions or signatures, skipping partition wipe."
    fi

    # Zero out first 400 MB for extra safety
    echo "Zeroing first 400MB of /dev/sda..."
    dd if=/dev/zero of=/dev/sda bs=1M count=400 conv=fdatasync status=progress || true

    # Reload partition table
    partprobe /dev/sda || true
    udevadm settle

else
    echo "/dev/sda not found!"
fi

echo "===== Pre-install wipe of /dev/sda completed ====="

%end


##################  Disk policy: Use Only sda 2TB - 4TB ####################
# Install target is usually sda, vda, or nvme0n1; adjust all references below accordingly.
# This tells the installer: “Only use sda for installation; ignore all other disks.”
# Any other disks (like sdb, sdc) are completely untouched — no partitions will be modified.
ignoredisk --only-use=sda
#zerombr
# Clear all partitions on the disks being used and create a new partition table.”
#clearpart --all --initlabel
clearpart --drives=sda --initlabel --disklabel=gpt

bootloader --boot-drive=sda --append="crashkernel=auto"

# BIOS Boot Partition (required for GPT + Legacy BIOS)
part biosboot --fstype="biosboot" --size=2 --ondisk=sda

# Boot Partition
part /boot --fstype="ext4" --ondisk=sda --size=2048 --label=boot

# EFI Partition
part /boot/efi --fstype="efi" --ondisk=sda --size=1024 --fsoptions="umask=0077,shortname=winnt" --label=EFI

# OS Partition
part pv.01 --fstype="lvmpv"   --ondisk=sda --size=194560

# DATA Partition 
part pv.02 --fstype="lvmpv"   --ondisk=sda --size=1024 --grow

# LVM: 
# Recommended value for PE (Physical Extent)
# LVM's default unit for --pesize is KiB (kilobytes).
## --pesize=4096 (4 MiB) is the default and recommended for most systems.
## --pesize=32768 (32 MiB) is suitable for large volumes, but less flexible.
## --pesize=1024 (1 MiB) offers more granularity for many small LVs.
## The value 4096 in this context refers to **kilobytes (KiB)**.
## This is equivalent to 4 MiB (mebibytes) and is the default value for the PE size.

# OS Volume Group
volgroup rl_vgos   --pesize=4096 pv.01

# Data Volume Group for Data
volgroup rl_vgdata --pesize=4096 pv.02

# LVM: 
# all sizes are in MB
# the sizes of the LVM LV's below require a disk with 185 GB
# Anaconda creates the LVs in reverse order; LVs listed at the end will be created first

# 100G Min
logvol /var/lib/libvirt --fstype="xfs" --size=102400 --grow --vgname=rl_vgos --name=kvm_libvirt
# 40G
logvol /     --fstype="ext4" --size=40960 --vgname=rl_vgos  --name=root
# 6G
logvol /tmp  --fstype="ext4" --size=6144  --vgname=rl_vgos --name=tmp  --fsoptions="nodev,noexec,nosuid"
# 10G
logvol /var  --fstype="ext4" --size=14336  --vgname=rl_vgos --name=var  --fsoptions="nodev"
# 16G
logvol swap  --fstype="swap" --size=16384  --vgname=rl_vgos --name=swap

