##################################################################

# Packages
%packages
@^minimal-environment
#@guest-agents
#kernel-devel
cockpit          # cockpit package
cockpit-*        # cockpit-* subpackages
-setroubleshoot  # Remove SELinux troubleshoot GUI tools
-subscription-manager-cockpit # Remove Cockpit plugin
openssh-server   # SSH daemon
lsof             # list open files
nano             # text editor
rsync            # file sync/copy
strace           # trace syscalls
tar              # archive utility
tcpdump          # packet sniffer
bc               # calculator
cryptsetup       # LUKS/disk encryption
curl             # HTTP tool
dosfstools       # FAT filesystem tools
firewalld        # firewall
mlocate          # locate command
net-tools        # ifconfig, netstat (legacy tools)
parted           # partition tool
vim              # text editor
wget             # HTTP/FTP download
bash-completion  # Programmable completion for Bash
dos2unix         # Text file format converters
%end

# Post (optional, kept minimal)
%post --interpreter=/usr/bin/bash --log=/root/anaconda-ks-post.log --erroronfail

# Disable SELinux
sed -i 's/^SELINUX=enforcing/SELINUX=disabled/' /etc/selinux/config

# Enable CodeReady Builder repo (requires `epel-release` package).
/usr/bin/dnf config-manager --set-enabled crb

# /etc/hosts configuration
echo "172.28.150.150 kvm-node40.lab.local kvm-node40" >> /etc/hosts

# For additional safety, set passwords to expire immediately after first boot:
#chage -d 0 root
chage -d 0 sysadmin

# Turing on rc-local.service
chmod 755 /etc/rc.d/rc.local
systemctl enable rc-local.service

%end

# Reboot after install
reboot --eject
