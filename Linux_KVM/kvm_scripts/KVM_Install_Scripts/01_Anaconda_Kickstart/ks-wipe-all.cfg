#logvol /var/log       --fstype="xfs"  --size=1024     --vgname=rl_vgos --name=var_log       --fsoptions="nodev,noexec,nosuid"
#logvol /var/log/audit --fstype="xfs"  --size=512      --vgname=rl_vgos --name=var_log_audit --fsoptions="nodev,noexec,nosuid"
#logvol /var/tmp       --fstype="xfs"  --size=1024     --vgname=rl_vgos --name=var_tmp       --fsoptions="nodev,noexec,nosuid"
#logvol /var           --fstype="xfs"  --size=6144     --vgname=rl_vgos --name=var           --fsoptions="nodev"
#logvol /tmp           --fstype="xfs"  --size=1024     --vgname=rl_vgos --name=tmp           --fsoptions="nodev,noexec,nosuid"
